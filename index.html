function renderImportPreviewHtml(preview){
  const mainItems = preview.matched.filter(m=>m.target==="main");
  const runeItems = preview.matched.filter(m=>m.target==="rune");
  const bfItems = preview.matched.filter(m=>m.target==="battlefield");
  const mainTotal = mainItems.reduce((a,m)=>a+m.qty,0);
  const runeTotal = runeItems.reduce((a,m)=>a+m.qty,0);
  return `
    <div class="card-surface pad">
      <h3>Preview</h3>
      <div class="row wrap" style="gap:22px;margin-bottom:10px;">
        <div><strong>${preview.legend?escapeHtml(preview.legend.name):"No legend detected"}</strong><div class="hint">Legend</div></div>
        <div><strong>${mainTotal}</strong><div class="hint">Main deck cards</div></div>
        <div><strong>${runeTotal}</strong><div class="hint">Rune cards</div></div>
        <div><strong>${bfItems.length}</strong><div class="hint">Battlefields</div></div>
      </div>
      ${preview.unmatched.length ? `
        <div style="margin-bottom:10px;">
          <div class="hint" style="color:var(--warn);font-weight:700;margin-bottom:4px;">${preview.unmatched.length} line(s) couldn't be matched to a card:</div>
          <div class="hint" style="font-family:var(--font-mono);white-space:pre-wrap;">${preview.unmatched.map(l=>escapeHtml(l)).join("\n")}</div>
        </div>` : ""}
      ${preview.matched.length ? `
        <div class="row wrap" style="gap:6px;margin-bottom:10px;">
          ${preview.matched.map(m=>`<span class="chip">${m.qty}× ${escapeHtml(m.card.name)}</span>`).join("")}
        </div>` : '<p class="hint">No matching cards found — nothing to import.</p>'}
      <div class="row" style="gap:8px;">
        <button class="btn small" id="importCommitBtn" ${preview.matched.length?"":"disabled"}>${builderState.importMergeIntoCurrent?"Add to current deck":"Create new deck from this list"}</button>
      </div>
    </div>
  `;
}
function wireImportPreview(){
  const btn = byId("importCommitBtn");
  if(btn) btn.addEventListener("click", ()=>commitImport(builderState.importPreview));
}
function commitImport(preview){
  if(!preview || !preview.matched.length) return;
  let deck;
  if(builderState.importMergeIntoCurrent){
    deck = activeDeck();
  } else {
    deck = blankDeck(preview.legend ? `Imported: ${preview.legend.name}` : "Imported Deck");
    STORE.decks.push(deck);
    STORE.activeId = deck.id;
  }
  if(preview.legend) setLegend(deck, preview.legend.id);
  for(const item of preview.matched){
    if(item.target==="main") addToMain(deck, item.card.id, item.qty);
    else if(item.target==="rune") addToRunes(deck, item.card.id, item.qty);
    else if(item.target==="battlefield" && deck.battlefields.length<3 && !deck.battlefields.includes(item.card.id)) toggleBattlefield(deck, item.card.id);
  }
  saveStore();
  builderState.importText=""; builderState.importPreview=null; builderState.tab="main"; builderState.deckSelected=new Set();
  renderBuilderView();
}


/* ===================== CHART HELPERS (inline SVG, self-contained) ===================== */
function svgLineChart(data, opts){
  const W = opts.width||560, H = opts.height||220;
  const padL=36, padR=18, padT=16, padB=28;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const xs = data.map(d=>d.x), ys = data.map(d=>d.y);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMax = opts.yMax!=null ? opts.yMax : Math.max(...ys, 0.0001)*1.15;
  const yMin = 0;
  const X = x => padL + (xMax>xMin ? (x-xMin)/(xMax-xMin) : 0)*innerW;
  const Y = y => padT + innerH - (yMax>yMin ? (y-yMin)/(yMax-yMin) : 0)*innerH;
  const pathD = data.map((d,i)=>`${i===0?"M":"L"} ${X(d.x).toFixed(1)} ${Y(d.y).toFixed(1)}`).join(" ");
  const areaD = `${pathD} L ${X(xs[xs.length-1]).toFixed(1)} ${Y(0).toFixed(1)} L ${X(xs[0]).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  const gridLines = [];
  const steps = 4;
  for(let i=0;i<=steps;i++){
    const gy = padT + innerH - (i/steps)*innerH;
    const val = (yMax*i/steps);
    gridLines.push(`<line x1="${padL}" x2="${W-padR}" y1="${gy}" y2="${gy}" stroke="var(--hair)" stroke-width="1"/>`);
    gridLines.push(`<text x="${padL-6}" y="${gy+3}" text-anchor="end" font-size="9" fill="var(--ink-muted)" font-family="var(--font-mono)">${opts.yFormat?opts.yFormat(val):Math.round(val)}</text>`);
  }
  const xTicks = data.filter((d,i)=> i%Math.ceil(data.length/8||1)===0 || i===data.length-1);
  const xTickSvg = xTicks.map(d=>`<text x="${X(d.x)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--ink-muted)" font-family="var(--font-mono)">${opts.xFormat?opts.xFormat(d.x):d.x}</text>`).join("");
  const last = data[data.length-1];
  const uid = "c"+Math.random().toString(36).slice(2,8);
  return `
  <svg viewBox="0 0 ${W} ${H}" class="linechart" data-chart="${uid}" style="width:100%;height:${H}px;overflow:visible;">
    <defs><linearGradient id="grad-${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${opts.color||'var(--accent)'}" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="${opts.color||'var(--accent)'}" stop-opacity="0.02"/>
    </linearGradient></defs>
    ${gridLines.join("")}
    ${xTickSvg}
    <path d="${areaD}" fill="url(#grad-${uid})" stroke="none"/>
    <path d="${pathD}" fill="none" stroke="${opts.color||'var(--accent)'}" stroke-width="2" stroke-linejoin="round"/>
    ${data.map(d=>`<circle cx="${X(d.x)}" cy="${Y(d.y)}" r="2.2" fill="${opts.color||'var(--accent)'}" opacity="0" class="hoverdot"/>`).join("")}
    <circle cx="${X(last.x)}" cy="${Y(last.y)}" r="3.4" fill="${opts.color||'var(--accent)'}"/>
    <text x="${clamp(X(last.x),padL,W-padR-30)}" y="${Y(last.y)-8}" font-size="10" font-weight="700" fill="var(--ink)" font-family="var(--font-mono)">${opts.labelFormat?opts.labelFormat(last.y):last.y}</text>
  </svg>`;
}

function wireChartHover(container, data, opts){
  const svg = container.querySelector("svg.linechart");
  if(!svg) return;
  const tip = el("div","tooltip"); tip.style.display="none"; document.body.appendChild(tip);
  const dots = svg.querySelectorAll(".hoverdot");
  svg.addEventListener("mousemove", e=>{
    const rect = svg.getBoundingClientRect();
    const relX = (e.clientX-rect.left)/rect.width;
    const idx = clamp(Math.round(relX*(data.length-1)),0,data.length-1);
    dots.forEach((d,i)=>d.setAttribute("opacity", i===idx?"1":"0"));
    const d = data[idx];
    tip.style.display="block";
    tip.innerHTML = opts.tooltip ? opts.tooltip(d) : `${d.x}: ${d.y}`;
    tip.style.left = clamp(e.clientX+12,8,window.innerWidth-268)+"px";
    tip.style.top = (e.clientY+12)+"px";
  });
  svg.addEventListener("mouseleave", ()=>{ tip.style.display="none"; dots.forEach(d=>d.setAttribute("opacity","0")); });
  container._tipEl = tip;
}

/* ===================== REUSABLE FORCE GRAPH ENGINE =====================
   A self-contained force-directed graph renderer used by both the Synergy
   Web view and the Turn Planner's "potential" graph. Each caller creates
   its own instance (own canvas, own state) via createForceGraph(). The
   caller is responsible for building {nodes, edges} data and calling
   setData()/start(); this module only owns rendering, physics, zoom/pan,
   and hover/click interaction. */
const FORCE_GRAPH_MAX_ITER = 220;

function createForceGraph(canvas, opts){
  opts = opts||{};
  const ctx = canvas.getContext("2d");
  const state = { nodes:[], edges:[], dragId:null, offsetX:0, offsetY:0, scale:1,
    hoverEdge:null, hoverNode:null, panning:false };
  let raf = null, tooltipEl = null, dragging=false, didDrag=false, panStart=null;
  let _winMouseMove = null, _winMouseUp = null;

  function resize(){
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio||1;
    canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
    canvas.style.width = rect.width+"px"; canvas.style.height = rect.height+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function edgeColor(reasons){
    const types = reasons.map(r=>r.type);
    if(types.includes("combo")) return getCss("--dom-chaos");
    if(types.includes("tribal")) return getCss("--accent");
    if(types.includes("keyword")) return getCss("--focus");
    return getCss("--ink-muted");
  }
  function domainNodeColor(card){
    const doms=(card.domain||[]).filter(d=>d!=="Colorless");
    return doms.length ? getCss(`--dom-${doms[0].toLowerCase()}`) : getCss("--dom-none");
  }

  function setData(nodes, edges){
    state.nodes = nodes; state.edges = edges;
  }
  function resetView(){ state.scale=1; state.offsetX=0; state.offsetY=0; }

  function start(){
    if(raf) cancelAnimationFrame(raf);
    const W = canvas.clientWidth, H = canvas.clientHeight;
    let iter=0;
    function tick(){
      const nodes = state.nodes, edges = state.edges;
      for(let i=0;i<nodes.length;i++){
        for(let j=i+1;j<nodes.length;j++){
          const a=nodes[i], b=nodes[j];
          let dx=a.x-b.x, dy=a.y-b.y; let d2=dx*dx+dy*dy; if(d2<1) d2=1;
          const d=Math.sqrt(d2);
          const force = 2600/d2;
          const fx=dx/d*force, fy=dy/d*force;
          if(a.id!==state.dragId){ a.vx+=fx; a.vy+=fy; }
          if(b.id!==state.dragId){ b.vx-=fx; b.vy-=fy; }
        }
      }
      for(const e of edges){
        const a=nodes.find(n=>n.id===e.a), b=nodes.find(n=>n.id===e.b);
        if(!a||!b) continue;
        const dx=b.x-a.x, dy=b.y-a.y; const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
        const rest = 220 - Math.min(140, e.score*1.4);
        const force = (d-rest)*0.02;
        const fx=dx/d*force, fy=dy/d*force;
        if(a.id!==state.dragId){ a.vx+=fx; a.vy+=fy; }
        if(b.id!==state.dragId){ b.vx-=fx; b.vy-=fy; }
      }
      for(const n of nodes){
        if(n.id===state.dragId) continue;
        const cx=W/2, cy=H/2;
        n.vx += (cx-n.x)*0.002; n.vy += (cy-n.y)*0.002;
        n.vx *= 0.82; n.vy *= 0.82;
        n.x += n.vx; n.y += n.vy;
        n.x = clamp(n.x, 30, W-30); n.y = clamp(n.y, 30, H-30);
      }
      draw();
      iter++;
      if(iter<FORCE_GRAPH_MAX_ITER) raf = requestAnimationFrame(tick);
      else raf = null;
    }
    tick();
  }

  function draw(){
    const W = canvas.clientWidth, H = canvas.clientHeight;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = getCss("--surface"); ctx.fillRect(0,0,W,H);
    ctx.save();
    ctx.translate(state.offsetX, state.offsetY);
    ctx.scale(state.scale, state.scale);
    for(const e of state.edges){
      const a = state.nodes.find(n=>n.id===e.a), b = state.nodes.find(n=>n.id===e.b);
      if(!a||!b) continue;
      const isHover = state.hoverEdge===e;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
      ctx.strokeStyle = edgeColor(e.reasons);
      ctx.globalAlpha = isHover ? 0.95 : 0.5;
      ctx.lineWidth = (isHover?1.7:1) * clamp(e.score/22, 1, 6);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    for(const n of state.nodes){
      const baseR = n.isCenter ? 16 : (n.hop===2 ? 7 : 10);
      const powerAdj = DECKBUILDABLE_TYPES.includes(n.card.type) ? clamp((cardPowerScore(n.card)-50)/50*3.5, -3, 4) : 0;
      const r = Math.max(4, baseR + powerAdj);
      const dim = n.hop===2 ? 0.75 : 1;
      ctx.globalAlpha = dim;
      ctx.beginPath(); ctx.arc(n.x,n.y,r,0,Math.PI*2);
      ctx.fillStyle = domainNodeColor(n.card);
      ctx.fill();
      ctx.lineWidth = state.hoverNode===n ? 3 : (n.isCenter?3:1.5);
      ctx.strokeStyle = state.hoverNode===n ? getCss("--focus") : getCss("--surface");
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = getCss("--ink");
      ctx.font = (n.isCenter?"700 12px":(n.hop===2?"600 9.5px":"600 10.5px")) + " " + getCss("--font-body");
      ctx.textAlign = "center";
      ctx.globalAlpha = dim;
      ctx.fillText(truncateLabel(n.card.name, n.isCenter?22:(n.hop===2?13:16)), n.x, n.y+r+13);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function zoomBy(factor, cx, cy){
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if(cx==null){ cx=W/2; cy=H/2; }
    const newScale = clamp(state.scale*factor, 0.4, 2.5);
    const ratio = newScale/state.scale;
    state.offsetX = cx - (cx-state.offsetX)*ratio;
    state.offsetY = cy - (cy-state.offsetY)*ratio;
    state.scale = newScale;
    draw();
  }

  function posFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX-rect.left, sy = e.clientY-rect.top;
    return { x:(sx-state.offsetX)/state.scale, y:(sy-state.offsetY)/state.scale };
  }
  function nodeAt(x,y){
    return state.nodes.find(n=>Math.hypot(n.x-x,n.y-y) < (n.isCenter?18:12));
  }

  function showTooltip(e, card, extraHtml){
    if(!tooltipEl){ tooltipEl = el("div","tooltip graph-tooltip"); document.body.appendChild(tooltipEl); }
    const imgHtml = card && card.img ? `<img src="${card.img}" alt="" loading="eager" referrerpolicy="no-referrer"
      style="display:block;width:96px;height:auto;aspect-ratio:744/1039;object-fit:cover;border-radius:6px;margin-bottom:6px;"
      onerror="this.remove();">` : "";
    tooltipEl.style.display="block";
    tooltipEl.innerHTML = imgHtml + extraHtml;
    tooltipEl.style.left = clamp(e.clientX+14,8,window.innerWidth-268)+"px";
    tooltipEl.style.top = (e.clientY+14)+"px";
  }
  function hideTooltip(){ if(tooltipEl) tooltipEl.style.display="none"; }

  function handleHover(e){
    const {x,y} = posFromEvent(e);
    let bestNode=null, bestNodeD=14;
    for(const n of state.nodes){
      const d = Math.hypot(n.x-x, n.y-y);
      const r = n.isCenter?16:(n.hop===2?7:10);
      if(d < r+6 && d < bestNodeD){ bestNodeD=d; bestNode=n; }
    }
    let bestEdge=null, bestEdgeD=8;
    if(!bestNode){
      for(const ed of state.edges){
        const a = state.nodes.find(n=>n.id===ed.a), b=state.nodes.find(n=>n.id===ed.b);
        if(!a||!b) continue;
        const d = distToSegment(x,y,a.x,a.y,b.x,b.y);
        if(d<bestEdgeD){ bestEdgeD=d; bestEdge=ed; }
      }
    }
    const changed = (state.hoverNode!==bestNode) || (state.hoverEdge!==bestEdge);
    state.hoverNode = bestNode;
    state.hoverEdge = bestEdge;
    if(bestNode){
      const powerLine = DECKBUILDABLE_TYPES.includes(bestNode.card.type) ? `Power score: ${cardPowerScore(bestNode.card)}` : "";
      showTooltip(e, bestNode.card, `<strong>${escapeHtml(bestNode.card.name)}</strong>${powerLine?`<br>${powerLine}`:""}`);
    } else if(bestEdge){
      const lines = bestEdge.reasons.slice(0,4).map(r=>escapeHtml(r.label)).join("<br>");
      showTooltip(e, null, `<strong>Synergy score: ${bestEdge.score}</strong><br>${lines}`);
    } else {
      hideTooltip();
    }
    if(changed && !raf) draw();
  }

  function wire(){
    canvas.addEventListener("mousedown", e=>{
      const {x,y} = posFromEvent(e);
      const hit = nodeAt(x,y);
      didDrag=false;
      if(hit){ state.dragId = hit.id; dragging=true; }
      else { panStart = { clientX:e.clientX, clientY:e.clientY, offsetX:state.offsetX, offsetY:state.offsetY }; state.panning=true; canvas.style.cursor="grabbing"; }
    });
    _winMouseMove = e=>{
      if(!canvas.isConnected) return; // view was switched away — this graph instance is dead, awaiting destroy()
      if(dragging && state.dragId){
        didDrag = true;
        const {x,y} = posFromEvent(e);
        const n = state.nodes.find(n=>n.id===state.dragId);
        if(n){ n.x=x; n.y=y; n.vx=0; n.vy=0; if(!raf) draw(); }
        return;
      }
      if(state.panning && panStart){
        const dx = e.clientX-panStart.clientX, dy = e.clientY-panStart.clientY;
        if(Math.abs(dx)>3 || Math.abs(dy)>3) didDrag = true;
        state.offsetX = panStart.offsetX + dx;
        state.offsetY = panStart.offsetY + dy;
        if(!raf) draw();
        return;
      }
      handleHover(e);
    };
    window.addEventListener("mousemove", _winMouseMove);
    _winMouseUp = ()=>{
      dragging=false; state.dragId=null;
      state.panning=false; panStart=null;
      canvas.style.cursor="grab";
    };
    window.addEventListener("mouseup", _winMouseUp);
    canvas.addEventListener("mouseleave", ()=>{ hideTooltip(); state.hoverEdge=null; state.hoverNode=null; if(!raf) draw(); });
    canvas.addEventListener("wheel", e=>{
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      zoomBy(e.deltaY<0 ? 1.12 : 0.89, e.clientX-rect.left, e.clientY-rect.top);
    }, { passive:false });
    canvas.addEventListener("click", e=>{
      if(didDrag){ didDrag=false; return; }
      const {x,y} = posFromEvent(e);
      const hit = nodeAt(x,y);
      if(hit && opts.onNodeClick) opts.onNodeClick(hit);
    });
    canvas.addEventListener("dblclick", e=>{
      const {x,y} = posFromEvent(e);
      const hit = nodeAt(x,y);
      if(hit) openCardModal(hit.id);
    });
  }
  wire();

  return { state, setData, resize, start, draw, resetView, zoomBy,
    destroy(){
      if(raf) cancelAnimationFrame(raf);
      if(tooltipEl){ tooltipEl.remove(); tooltipEl=null; } // else it survives as a stray floating element after the view switches away
      if(_winMouseMove) window.removeEventListener("mousemove", _winMouseMove);
      if(_winMouseUp) window.removeEventListener("mouseup", _winMouseUp);
    } };
}

function getCss(varName){ return getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || "#888"; }
function distToSegment(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay;
  const len2 = dx*dx+dy*dy;
  let t = len2>0 ? ((px-ax)*dx+(py-ay)*dy)/len2 : 0;
  t = clamp(t,0,1);
  const cx = ax+t*dx, cy = ay+t*dy;
  return Math.hypot(px-cx, py-cy);
}
function truncateLabel(s,n){ return s.length>n ? s.slice(0,n-1)+"…" : s; }

/* ===================== VIEW: SYNERGY WEB ===================== */
const graphState = { mode:"card", centerId:"", edgesPerNode:10, minScore:20, hops:2 };
let graphEngine = null;
let _graphResizeHandler = null;
const GRAPH_MAX_NODES = 70;

function renderGraphView(){

  root.innerHTML = `

    <div class="card-surface pad" style="margin-bottom:12px;">
      <div class="row wrap" style="gap:10px;">

function buildSynergyWebData(){
  const W = 600, H = 500;
  const nodesMap = new Map();
  const edges = [];
  const edgeKeys = new Set();
  function pairKey(a,b){ return a<b ? a+"|"+b : b+"|"+a; }
  function addNode(card, isCenter, hop){
    if(nodesMap.has(card.id)){
      const existing = nodesMap.get(card.id);
      if(isCenter) existing.isCenter=true;
      if(hop!=null && hop<existing.hop) existing.hop=hop;
      return existing;
    }
    const angle = Math.random()*Math.PI*2, r = isCenter?0:Math.min(W,H)*0.32;
    const n = { id:card.id, card, isCenter:!!isCenter, hop: hop==null?(isCenter?0:1):hop,
      x: W/2 + Math.cos(angle)*r + (Math.random()-0.5)*20, y: H/2 + Math.sin(angle)*r + (Math.random()-0.5)*20,
      vx:0, vy:0 };
    nodesMap.set(card.id, n); return n;
  }
  function addEdge(aId,bId,score,reasons){
    const key = pairKey(aId,bId);
    if(edgeKeys.has(key)) return;
    edgeKeys.add(key);
    edges.push({ a:aId, b:bId, score, reasons });
  }
  if(graphState.mode==="card"){
    const center = CARD_BY_ID.get(graphState.centerId);
    if(!center) return { nodes:[], edges:[] };
    addNode(center, true, 0);
    const pool = POOL_MAIN.concat(LEGENDS).filter(c=>c.id!==center.id);
    const tops = topSynergiesFor(center, pool, graphState.edgesPerNode).filter(s=>s.score>=graphState.minScore);
    for(const s of tops){
      addNode(s.card, false, 1);
      addEdge(center.id, s.card.id, s.score, s.reasons);
    }
    if(graphState.hops>=2 && nodesMap.size<GRAPH_MAX_NODES){
      const secondHopPerNode = Math.max(3, Math.min(5, Math.round(graphState.edgesPerNode/2)));
      const secondMinScore = Math.max(graphState.minScore, 24);
      for(const s of tops){
        if(nodesMap.size>=GRAPH_MAX_NODES) break;
        const fromCard = s.card;
        const subPool = POOL_MAIN.concat(LEGENDS).filter(c=>c.id!==fromCard.id && c.id!==center.id);
        const subTops = topSynergiesFor(fromCard, subPool, secondHopPerNode).filter(x=>x.score>=secondMinScore);
        for(const s2 of subTops){
          if(!nodesMap.has(s2.card.id) && nodesMap.size>=GRAPH_MAX_NODES) break;
          addNode(s2.card, false, 2);
          addEdge(fromCard.id, s2.card.id, s2.score, s2.reasons);
        }
      }
    }
  } else {
    const deck = activeDeck();
    const distinct = deckMainCards(deck).map(x=>x.card);
    distinct.forEach(c=>addNode(c, false, 1));
    for(let i=0;i<distinct.length;i++){
      for(let j=i+1;j<distinct.length;j++){
        const r = computeSynergy(distinct[i], distinct[j]);
        if(r && r.score>=graphState.minScore) addEdge(distinct[i].id, distinct[j].id, r.score, r.reasons);
      }
    }
  }
  return { nodes:[...nodesMap.values()], edges };
}

function rebuildGraphView(){
  const { nodes, edges } = buildSynergyWebData();
  graphEngine.setData(nodes, edges);
  graphEngine.start();
  renderGraphSidebar(nodes, edges);
}

function renderGraphSidebar(nodes, edges){
  const box = byId("graphSidebar");
  if(graphState.mode==="card"){
    const center = CARD_BY_ID.get(graphState.centerId);
    if(!center){ box.innerHTML=""; return; }
    const directEdges = edges.filter(e=>e.a===center.id||e.b===center.id);
    box.innerHTML = `<h3>${escapeHtml(center.name)}</h3>
      <p class="hint" style="margin-bottom:8px;">${nodes.length} cards shown (${graphState.hops===2?'2 hops':'1 hop'}) · ${edges.length} links total.</p>
      <div class="row wrap" style="gap:10px;">
        ${directEdges.map(e=>{
          const other = e.a===center.id ? e.b : e.a;
          const oc = CARD_BY_ID.get(other);
          return `<div class="chip clickable" data-open="${oc.id}" style="padding:6px 10px;">${escapeHtml(oc.name)} <span class="tabular" style="opacity:.7;">(${e.score})</span></div>`;
        }).join("")}
      </div>`;
    box.querySelectorAll("[data-open]").forEach(c=>c.addEventListener("click", ()=>openCardModal(c.getAttribute("data-open"))));
  } else {
    box.innerHTML = `<h3>Deck synergy links</h3><p class="hint">${edges.length} links between ${nodes.length} unique cards (score ≥ ${graphState.minScore}).</p>`;
  }
}

function saveMetaDecklistAsDeck(metaDeck, rows){
  const legendCard = findCardByName(metaDeck.legend) || rows.map(r=>r.card).find(c=>c && c.type==="Legend");
  const deck = blankDeck(metaDeck.archetype_name || (metaDeck.legend ? metaDeck.legend+" (meta)" : "Imported meta deck"));
  if(legendCard) deck.legendId = legendCard.id;
  let skipped = 0;
  for(const r of rows){
    const card = r.card;
    if(!card){ skipped++; continue; }
    if(card.type==="Legend"){ deck.legendId = card.id; continue; }
    if(card.type==="Rune"){ deck.runes[card.id] = clamp((deck.runes[card.id]||0)+r.count, 0, card.supertype==="Basic"?12:3); continue; }
    if(card.type==="Battlefield"){ if(!deck.battlefields.includes(card.id) && deck.battlefields.length<3) deck.battlefields.push(card.id); continue; }
    deck.main[card.id] = clamp((deck.main[card.id]||0)+r.count, 0, copyLimit(card));
  }
  STORE.decks.push(deck);
  STORE.activeId = deck.id;
  saveStore();
  renderTopbarLegendPill();
  closeModal();
  switchView("builder");
  const nb = document.querySelector("[data-view='builder']"); if(nb) nb.click();
  alert(`Saved "${deck.name}" as a new deck in your Deck Builder${skipped?` (${skipped} card(s) not found in the database were skipped)`:""}.`);
}

          <input type="search" id="plannerDrawSearch" placeholder="Search legal cards to add to your hand…" value="${escapeHtml(plannerState.drawQ)}">
          <div id="plannerDrawResults" class="row wrap" style="gap:6px;margin-top:8px;"></div>
        </div>

        <div class="card-surface pad" style="margin-bottom:12px;">
          <h3>Potential</h3>
          <p class="hint" style="margin-bottom:8px;">Ranked by synergy with your hand/board plus your selected intent. "Potential" blends aggregate synergy (65%) with the intent axis percentile (35%).</p>
          <div class="row wrap" style="gap:8px;margin-bottom:8px;">
            <select id="plannerPoolScope">
              <option value="deck" ${plannerState.poolScope==="deck"?"selected":""}>Remaining in your deck</option>
              <option value="wide" ${plannerState.poolScope==="wide"?"selected":""}>Wider pool (your Legend's colors)</option>
            </select>
            <label class="row" style="gap:6px;">Min. potential <input type="number" id="plannerMinPotential" min="0" max="100" value="${plannerState.minPotential}" style="width:56px;"></label>
          </div>
          <div class="row wrap" style="gap:6px;margin-bottom:10px;" id="plannerCategoryFilters">
            <span class="chip clickable ${!plannerState.categoryFilter?"on":""}" data-cat="">All</span>
            ${CATEGORY_DEFS.map(c=>`<span class="chip clickable ${plannerState.categoryFilter===c.key?"on":""}" data-cat="${c.key}">${escapeHtml(c.label)}</span>`).join("")}
          </div>
          <div id="plannerPotentialList" class="grid" style="grid-template-columns:1fr;gap:6px;max-height:420px;overflow-y:auto;"></div>
        </div>

        <div class="card-surface pad">
          <h3>Draw chance by category</h3>
          <p class="hint" style="margin-bottom:8px;">Chance you've drawn at least one card of each category by the current turn (hypergeometric, from your actual deck — independent of the hand above).</p>
          <div id="plannerCategoryTable"></div>
        </div>
      </div>
    </div>
  `;

  byId("deckPicker") && byId("deckPicker").addEventListener("change", e=>{ STORE.activeId=e.target.value; saveStore(); renderTurnPlannerView(); });
  const nb=byId("btnNewDeck"); if(nb) nb.addEventListener("click", ()=>{ const d=blankDeck("New deck "+(STORE.decks.length+1)); STORE.decks.push(d); STORE.activeId=d.id; saveStore(); renderTurnPlannerView(); });
  const rb=byId("btnRenameDeck"); if(rb) rb.addEventListener("click", ()=>{ const name=prompt("New name:",deck.name); if(name){deck.name=name;saveStore();renderTurnPlannerView();} });
  const db=byId("btnDeleteDeck"); if(db) db.addEventListener("click", ()=>{ if(STORE.decks.length<=1){alert("At least one deck is required.");return;} if(!confirm("Delete?"))return; STORE.decks=STORE.decks.filter(d=>d.id!==deck.id); STORE.activeId=STORE.decks[0].id; saveStore(); renderTurnPlannerView(); });

  byId("plannerIntent").addEventListener("change", e=>{ plannerState.intent=e.target.value; renderTurnPlannerView(); });
  byId("plannerNextTurn").addEventListener("click", ()=>{ plannerState.turn++; renderTurnPlannerView(); });
  byId("plannerReset").addEventListener("click", ()=>{ if(!confirm("Reset the hand, board, and turn counter?")) return; plannerState.hand=[]; plannerState.board=[[],[],[]]; plannerState.turn=1; plannerState.selectedSlot=0; renderTurnPlannerView(); });

  root.querySelectorAll("[data-select-slot]").forEach(elx=>elx.addEventListener("click", ()=>{ plannerState.selectedSlot=parseInt(elx.getAttribute("data-select-slot")); renderTurnPlannerView(); }));
  wirePlannerTokens(root);

  const drawSearch = byId("plannerDrawSearch");
  drawSearch.addEventListener("input", debounce(e=>{ plannerState.drawQ=e.target.value; renderPlannerDrawResults(); },150));
  renderPlannerDrawResults();

  byId("plannerPoolScope").addEventListener("change", e=>{ plannerState.poolScope=e.target.value; refreshPlannerPotential(); });
  byId("plannerMinPotential").addEventListener("change", e=>{ plannerState.minPotential=parseInt(e.target.value)||0; refreshPlannerPotential(); });
  root.querySelectorAll("[data-cat]").forEach(chip=>chip.addEventListener("click", ()=>{
    plannerState.categoryFilter = chip.getAttribute("data-cat");
    root.querySelectorAll("[data-cat]").forEach(c=>c.classList.toggle("on", c===chip));
    refreshPlannerPotential();
  }));

  if(plannerGraphEngine) plannerGraphEngine.destroy(); // else re-rendering this view (e.g. every "Next Turn") leaks a tooltip + window listeners
  const canvas = byId("plannerCanvas");
  plannerGraphEngine = createForceGraph(canvas, { onNodeClick: n=>{ /* clicking recenter not meaningful here; no-op */ } });
  plannerGraphEngine.resize();
  if(_plannerResizeHandler) window.removeEventListener("resize", _plannerResizeHandler);
  _plannerResizeHandler = ()=>{ if(plannerGraphEngine) plannerGraphEngine.resize(); };
  window.addEventListener("resize", _plannerResizeHandler);
  byId("plannerZoomIn").addEventListener("click", ()=>plannerGraphEngine.zoomBy(1.25));
  byId("plannerZoomOut").addEventListener("click", ()=>plannerGraphEngine.zoomBy(0.8));
  byId("plannerZoomReset").addEventListener("click", ()=>{ plannerGraphEngine.resetView(); plannerGraphEngine.draw(); });

  refreshPlannerPotential();
  renderPlannerCategoryTable();
}

function plannerTokenHtml(cardId, area, slotIdx){
  const card = CARD_BY_ID.get(cardId);
  if(!card) return "";
  const label = `${card.energy!=null?card.energy+"⚡ ":""}${escapeHtml(card.name)}`;
  if(area==="hand"){
    return `<span class="chip planner-token"><span class="clickable" data-play-id="${cardId}">${label}</span><button class="tokbtn" data-discard-id="${cardId}" title="Discard from hand">×</button></span>`;
  }
  return `<span class="chip planner-token"><span class="clickable" data-return-id="${cardId}" data-return-slot="${slotIdx}">${label}</span></span>`;
}

function wirePlannerTokens(root){
  root.querySelectorAll("[data-play-id]").forEach(elx=>elx.addEventListener("click", ()=>{
    const id = elx.getAttribute("data-play-id");
    const idx = plannerState.hand.indexOf(id);
    if(idx<0) return;
    plannerState.hand.splice(idx,1);
    plannerState.board[plannerState.selectedSlot].push(id);
    renderTurnPlannerView();
  }));
  root.querySelectorAll("[data-discard-id]").forEach(elx=>elx.addEventListener("click", e=>{
    e.stopPropagation();
    const id = elx.getAttribute("data-discard-id");
    const idx = plannerState.hand.indexOf(id);
    if(idx>=0) plannerState.hand.splice(idx,1);
    renderTurnPlannerView();
  }));
  root.querySelectorAll("[data-return-id]").forEach(elx=>elx.addEventListener("click", ()=>{
    const id = elx.getAttribute("data-return-id");
    const slot = parseInt(elx.getAttribute("data-return-slot"));
    const arr = plannerState.board[slot];
    const idx = arr.indexOf(id);
    if(idx<0) return;
    arr.splice(idx,1);
    plannerState.hand.push(id);
    renderTurnPlannerView();
  }));
}

function renderPlannerDrawResults(){
  const box = byId("plannerDrawResults");
  const q = plannerState.drawQ.trim().toLowerCase();
  if(!q){ box.innerHTML=""; return; }
  const deck = activeDeck();
  const legend = deckLegend(deck);
  const matches = POOL_MAIN.filter(c=>cardLegalForLegend(c, legend) && c.name.toLowerCase().includes(q)).slice(0,10);
  box.innerHTML = matches.map(c=>`<span class="chip clickable" data-draw-id="${c.id}">${escapeHtml(c.name)}</span>`).join("") || '<span class="hint">No legal matches.</span>';
  box.querySelectorAll("[data-draw-id]").forEach(chip=>chip.addEventListener("click", ()=>{
    plannerState.hand.push(chip.getAttribute("data-draw-id"));
    plannerState.drawQ=""; byId("plannerDrawSearch").value="";
    renderTurnPlannerView();
  }));
}

function potentialRowHtml(item){
  const cats = categoriesForCard(item.card).map(k=>CATEGORY_DEFS.find(c=>c.key===k)?.label).filter(Boolean);
  const bestLink = item.contributions[0];
  return `
    <div class="row" style="justify-content:space-between;align-items:center;padding:8px 10px;background:var(--surface-2);border-radius:8px;gap:8px;">
      <div style="min-width:0;flex:1;cursor:pointer;" data-view-potential="${item.card.id}">
        <div class="row" style="gap:6px;align-items:center;">
          <strong>${escapeHtml(item.card.name)}</strong>
          ${item.card.energy!=null?`<span class="hint">${item.card.energy}⚡</span>`:""}
        </div>
        <div class="hint" style="font-size:.68rem;">${cats.join(" · ")||"—"}${bestLink?` · synergy w/ ${escapeHtml(bestLink.card.name)}`:""}</div>
      </div>
      <div class="tabular" style="font-weight:700;min-width:30px;text-align:right;" title="Potential score">${item.potential}</div>
      <button class="btn small" data-draw-potential="${item.card.id}" title="Draw to hand">+</button>

function refreshPlannerPotential(){
  const committed = plannerCommittedCards();
  let pool = plannerPool();
  if(plannerState.categoryFilter) pool = pool.filter(c=>categoriesForCard(c).includes(plannerState.categoryFilter));
  let list = rankPotentialCards(committed, pool, plannerState.intent, 60);
  list = list.filter(x=>x.potential>=plannerState.minPotential);
  plannerState._potentialList = list.slice(0,30);
  const box = byId("plannerPotentialList");
  if(!committed.length && plannerState.intent==="none"){
    box.innerHTML = '<p class="hint">Draw or play some cards, or pick an intent, to see suggestions.</p>';
  } else {
    box.innerHTML = plannerState._potentialList.length ? plannerState._potentialList.map(potentialRowHtml).join("") : '<p class="hint">No cards match your filters yet.</p>';
  }
  box.querySelectorAll("[data-draw-potential]").forEach(btn=>btn.addEventListener("click", e=>{
    e.stopPropagation();
    plannerState.hand.push(btn.getAttribute("data-draw-potential"));
    renderTurnPlannerView();
  }));
  box.querySelectorAll("[data-view-potential]").forEach(elx=>elx.addEventListener("click", ()=>openCardModal(elx.getAttribute("data-view-potential"))));
  rebuildPlannerGraph(committed, plannerState._potentialList.slice(0,PLANNER_GRAPH_MAX_POTENTIAL));
}

function buildPlannerGraphData(committed, potentialList){
  const W=600, H=500;
  const nodesMap = new Map();
  const edges = []; const edgeKeys = new Set();
  function pairKey(a,b){ return a<b ? a+"|"+b : b+"|"+a; }
  function addNode(card, isCenter, hop){
    if(nodesMap.has(card.id)){
      const ex = nodesMap.get(card.id);
      if(isCenter) ex.isCenter=true;
      if(hop!=null && hop<ex.hop) ex.hop=hop;
      return ex;
    }
    const angle = Math.random()*Math.PI*2, r = isCenter?0:Math.min(W,H)*0.32;
    const n = { id:card.id, card, isCenter:!!isCenter, hop: hop==null?(isCenter?0:1):hop,
      x: W/2+Math.cos(angle)*r+(Math.random()-0.5)*20, y: H/2+Math.sin(angle)*r+(Math.random()-0.5)*20, vx:0, vy:0 };
    nodesMap.set(card.id, n); return n;
  }
  function addEdge(aId,bId,score,reasons){
    const key = pairKey(aId,bId);
    if(edgeKeys.has(key)) return;
    edgeKeys.add(key);
    edges.push({ a:aId, b:bId, score, reasons });
  }
  committed.forEach(c=>addNode(c, true, 0));
  for(let i=0;i<committed.length;i++){
    for(let j=i+1;j<committed.length;j++){
      const r = computeSynergy(committed[i], committed[j]);
      if(r) addEdge(committed[i].id, committed[j].id, r.score, r.reasons);
    }
  }
  for(const p of potentialList){
    addNode(p.card, false, 1);
    if(p.contributions && p.contributions.length){
      const best = p.contributions[0];
      addEdge(p.card.id, best.card.id, best.score, best.reasons);
    }
  }
  return { nodes:[...nodesMap.values()], edges };
}

function rebuildPlannerGraph(committed, potentialList){
  if(!plannerGraphEngine) return;
  const { nodes, edges } = buildPlannerGraphData(committed, potentialList);
  plannerGraphEngine.setData(nodes, edges);
  plannerGraphEngine.start();
}

function renderPlannerCategoryTable(){
  const deck = activeDeck();
  const box = byId("plannerCategoryTable");
  if(deckMainCount(deck)===0){ box.innerHTML = '<p class="hint">Add cards to your main deck to see category draw chances.</p>'; return; }
  const maxTurn = Math.max(10, plannerState.turn);
  const data = categoryDrawSeriesForDeck(deck, maxTurn, true);
  const T = plannerState.turn;
  box.innerHTML = `<div class="grid" style="grid-template-columns:1fr auto auto;gap:5px 12px;align-items:center;">
    <div class="hint" style="font-weight:700;">Category</div><div class="hint" style="font-weight:700;">Count</div><div class="hint" style="font-weight:700;">By turn ${T}</div>
    ${CATEGORY_DEFS.map(c=>{
      const d = data[c.key];
      const atT = d.series.find(s=>s.turn===T) || d.series[d.series.length-1];
      return `<div>${escapeHtml(c.label)}</div><div class="tabular">${d.count}</div><div class="tabular" style="font-weight:700;">${fmtPct(atT?atT.p:0)}</div>`;
    }).join("")}
  </div>`;
}


/* ===================== APP SHELL / BOOT ===================== */
const VIEWS = [
  { key:"database", label:"Card Database", render:renderDatabaseView },
  { key:"builder",  label:"Deck Builder",  render:renderBuilderView },
  { key:"stats",    label:"Statistics",    render:renderStatsView },
  { key:"synergy",  label:"Synergy Web",   render:renderGraphView },
  { key:"planner",  label:"Turn Planner",  render:renderTurnPlannerView },
  { key:"meta",     label:"Meta & Tournaments", render:renderMetaView },
];
let currentView = "database";

function switchView(key){
  // leaving a view with a force-graph (Synergy Web / Turn Planner) while a
  // tooltip is showing doesn't fire the canvas's mouseleave — tear the graph
  // engine down explicitly so its floating tooltip can't strand itself over
  // whatever view we're switching to
  if(currentView==="synergy" && key!=="synergy" && graphEngine){ graphEngine.destroy(); }
  if(currentView==="planner" && key!=="planner" && plannerGraphEngine){ plannerGraphEngine.destroy(); }
  currentView = key;
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active", b.getAttribute("data-view")===key));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active", v.id===("view-"+key)));
  const v = VIEWS.find(v=>v.key===key);
  if(v) v.render();
}

function renderTopbarLegendPill(){
  const deck = activeDeck();
  const legend = deckLegend(deck);
  const pill = byId("topbarLegendPill");
  if(!legend){ pill.innerHTML = `<span class="hint">No Legend selected</span>`; return; }
  pill.innerHTML = `${(legend.domain||[]).map(d=>domainChip(d)).join(" ")} <strong style="margin-left:6px;">${escapeHtml(legend.name)}</strong>`;
}

function wireGlobalEvents(){
  document.body.addEventListener("click", e=>{
    const closeBtn = e.target.closest("[data-action='close-modal']");
    if(closeBtn){ closeModal(); return; }
    const openCardBtn = e.target.closest("[data-action='open-card']");
    if(openCardBtn){ openCardModal(openCardBtn.getAttribute("data-id")); return; }
    const addToDeckBtn = e.target.closest("[data-action='add-to-deck']");
    if(addToDeckBtn){
      const sel = byId("modalAddDeckSelect");
      const targetId = sel ? sel.value : STORE.activeId;
      const deck = STORE.decks.find(d=>d.id===targetId) || activeDeck();
      addToMain(deck, addToDeckBtn.getAttribute("data-id"), 1);
      const fb = byId("modalAddFeedback");
      if(fb){ fb.textContent = `Added to "${deck.name}".`; fb.style.display=""; }
      if(currentView==="builder") renderBuilderView();
      renderTopbarLegendPill();
      return;
    }
    const synergyBtn = e.target.closest("[data-action='view-synergy']");
    if(synergyBtn){ graphState.centerId = synergyBtn.getAttribute("data-id"); graphState.mode="card"; closeModal(); switchView("synergy"); document.querySelector("[data-view='synergy']").click(); return; }
  });
  // keyword tooltip + card hover-preview delegation. Both are re-validated on
  // every mousemove (not just hidden via mouseout) because a click handler
  // elsewhere in this app can innerHTML-replace the very element the mouse
  // is resting on (e.g. picking a Legend re-renders the tab under an
  // unmoved cursor) — the browser never fires mouseout for a node that gets
  // destroyed without the pointer actually moving off it, so a hide that
  // only listens for mouseout can get permanently stuck showing stale
  // content. Continuously re-checking "is the mouse currently over a
  // hoverable target" on move is self-correcting regardless of how the
  // previous target went away.
  document.body.addEventListener("mouseover", e=>{
    const t = e.target.closest(".kwterm");
    if(t) showKwTooltip(t);
  });
  document.body.addEventListener("mouseover", e=>{
    const mc = e.target.closest(".mini-card[data-card-id]");
    if(mc && !mc.closest(".modal")){
      const card = CARD_BY_ID.get(mc.getAttribute("data-card-id"));
      if(card) showCardHoverPreview(e, card);
      return;
    }
    const dn = e.target.closest("[data-decklist-card-id]");
    if(dn){
      const card = CARD_BY_ID.get(dn.getAttribute("data-decklist-card-id"));
      if(card) showCardHoverPreview(e, card, { withinCards: metaState.hoverPool||[] });
    }
  });
  document.body.addEventListener("mousemove", e=>{
    const kwt = e.target.closest(".kwterm");
    if(kwt){ if(_kwTooltipEl) positionTooltip(kwt); } else { hideKwTooltip(); }
    const hoverable = e.target.closest(".mini-card[data-card-id]") || e.target.closest("[data-decklist-card-id]");
    if(hoverable){ positionHoverCardPreview(e); } else { hideCardHoverPreview(); }
  });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeModal(); closeAccountModal(); } });
}

function buildShell(){
  byId("sidebarNav").innerHTML = VIEWS.map(v=>`<button class="navbtn" data-view="${v.key}">${escapeHtml(v.label)}</button>`).join("");
  document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click", ()=>switchView(b.getAttribute("data-view"))));
  byId("mainViews").innerHTML = VIEWS.map(v=>`<div class="view" id="view-${v.key}"></div>`).join("");
}

function init(){
  buildShell();
  wireGlobalEvents();
  renderTopbarLegendPill();
  initAccountSystem();
  switchView("database");
}
document.addEventListener("DOMContentLoaded", init);

</script>
